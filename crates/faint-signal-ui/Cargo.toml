[package]
name = "faint-signal-ui"
description = "FaintSignal Linux GUI (iced)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "faintsignal-ui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
faint-signal-core.workspace = true
faint-signal-store.workspace = true
faint-signal-calls.workspace = true
iced = { version = "0.13", features = ["tokio", "debug", "image", "qr_code"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ksni = { version = "0.3", features = ["blocking"] }
uuid.workspace = true
